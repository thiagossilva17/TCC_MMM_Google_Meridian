id: SENS-V1
temporal_ref: TEMPORAL-V1
holdout_ref: HOLDOUT-V1
diagnostics_ref: DIAG-V1
status: not_executed
reference_prior: PRIOR-0
stability:
  id: STABILITY-V1
  summaries:
  - mean
  - median
  - 90pct credible interval
  - absolute difference
  - relative difference only above substantive floor
  - interval width
  - ranking probabilities
  - baseline change
  - development error
  relative_denominator_floor: null
  relative_floor_policy: Specify substantive floor in conversions before results;
    otherwise suppress relative percentages.
  probability_policy: P(C_alt>C_ref) under explicitly independent product of posteriors;
    resample independent indices, never pair draw i across fits; not a jointly identified
    causal contrast
  classification:
    stable: substantive interpretation preserved across eligible specifications, with
      uncertainty
    moderate: magnitudes vary but main qualitative conclusion persists
    high: conclusion or probability ordering changes among eligible specifications
    inconclusive: uncertainty or computational/identification failure prevents judgment
    not_comparable: different population, period or counterfactual without harmonized
      estimand
  threshold_policy: no arbitrary percentage cutoffs; report numerical changes and
    uncertainty
